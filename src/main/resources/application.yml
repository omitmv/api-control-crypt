spring:
  application:
    name: api-control-crypt

  datasource:
    url: ${DB_URL:jdbc:mysql://cerfc.com.br:3306/rafa2370_data_control_crypt?useSSL=true&requireSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:rafa2370_user_control_crypt}
    password: ${DB_PASSWORD:Raf@e46c15}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:changeme-super-secret-key-at-least-256-bits-long-here}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  # CVE-2026-22733: Disable CloudFoundry-specific actuator endpoints (not used in this deployment).
  # CVE-2026-22731: No health groups are configured; upgrade spring-boot-starter-parent to 3.5.11+
  #                 when available to fully remediate the health-groups authentication bypass.
  cloudfoundry:
    enabled: false

logging:
  level:
    com.example.apicontrolcrypt: INFO
